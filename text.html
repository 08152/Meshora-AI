<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to 3D | RISKY 3D AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a class="logo" href="/">RISKY<span>3D</span> AI</a>
        <nav>
            <a href="/">START</a>
            <a href="/training.html">KI TRAINING</a>
        </nav>
    </header>

    <main class="workspace">
        <section class="panel">
            <div class="tag">GENERATION</div>
            <h1>TEXT TO <span>3D</span></h1>
            <p>Beschreibe dein gewünschtes Modell.</p>

            <label for="prompt">MODELLBESCHREIBUNG</label>
            <textarea id="prompt" placeholder="Ein mittelalterliches Schwert mit goldenem Griff ..."></textarea>

            <label for="shape">MODELLTYP</label>
            <select id="shape">
                <option value="auto">Automatisch</option>
                <option value="cube">Würfel</option>
                <option value="sphere">Kugel</option>
                <option value="cylinder">Zylinder</option>
                <option value="cone">Kegel</option>
                <option value="torus">Ring</option>
            </select>

            <button id="generate">3D-MODELL ERSTELLEN</button>
            <p id="status" class="status">Bereit.</p>
            <a class="back-link" href="/">← Zurück</a>
        </section>

        <section class="preview-panel">
            <div class="preview-heading">3D VORSCHAU</div>
            <div id="viewer"></div>
            <button id="export" class="secondary">GLB EXPORTIEREN</button>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
