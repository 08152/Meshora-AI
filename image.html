<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to 3D | RISKY 3D AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a class="logo" href="/">RISKY<span>3D</span> AI</a>
        <nav>
            <a href="/">START</a>
            <a href="/training.html">KI TRAINING</a>
        </nav>
    </header>

    <main class="workspace">
        <section class="panel">
            <div class="tag">IMAGE INPUT</div>
            <h1>IMAGE TO <span>3D</span></h1>
            <p>Lade ein Bild als Vorlage hoch.</p>

            <label class="upload-area" for="imageInput">
                <span>＋</span>
                <strong>BILD AUSWÄHLEN</strong>
                <small>PNG, JPG oder WEBP</small>
            </label>
            <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp" hidden>

            <img id="imagePreview" class="image-preview" alt="Bildvorschau">

            <label for="shape">VORSCHAU-TYP</label>
            <select id="shape">
                <option value="sphere">Kugel</option>
                <option value="cube">Würfel</option>
                <option value="cylinder">Zylinder</option>
                <option value="cone">Kegel</option>
                <option value="torus">Ring</option>
            </select>

            <button id="generate">VORSCHAU ERSTELLEN</button>
            <p id="status" class="status">Noch kein Bild ausgewählt.</p>
            <a class="back-link" href="/">← Zurück</a>
        </section>

        <section class="preview-panel">
            <div class="preview-heading">3D VORSCHAU</div>
            <div id="viewer"></div>
            <button id="export" class="secondary">GLB EXPORTIEREN</button>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
